# Parser audit, top 4 bugs (28 Nov 2026): a model number before 'do Nk', a negation before 'preko', several model years / 'stariji od',
# unknown leftover words becoming a model. Ids "v2-ah-...". 'prije / stariji od' leave the named year out, 'poslije / novije od' too.
cases:
- id: v2-ah-modelno-0
  category: audit_high
  impact: visible
  title: "'bmw 320 do 15k KM': the number is part of the model"
  turns:
    - say: 'bmw 320 do 15k KM'
      expect: {"intent": "find", "filters": {"search": "bmw 320", "budget": 15000, "price_min": null}}


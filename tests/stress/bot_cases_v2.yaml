# Garaža bot stress cases, v2: adversarial cases the first 100 (bot_cases.yaml) missed. 21 Nov 2026.
#
# Same schema and rules as bot_cases.yaml (see tests/stress/README.md): expectations are PRODUCT INTENT, written from
# what a sensible user in Bosnia and Herzegovina wants, not from what the parser does today. A failing case is a
# finding. Every id starts with "v2-" (`python -m tests.stress.runner --new`).
#
# Extra keys used here (all optional):
#   case:   impact  silent   = a wrong answer the user cannot tell is wrong (wrong filter, dropped model / bound)
#                   dead_end = the bot gives up or offers nonsense ("did you mean Polo?") on a clear request
#                   visible  = the bot visibly misunderstands; the user can rephrase
#                   cosmetic = right answer, awkward wording
#                   guard    = works today; protects it against regressions
#   turn:   untagged (group message without @mention), user (another allowlisted user id, e.g. 456)
#   expect: labels_has[] / labels_lacks[] (intent labels: "kn", "skipped:trends", ...), lt{} / gt{} (a filter
#           strictly below / above a value), days (trends window), reply_chars_max
#
# The fake database (harness.py) knows ~60 make/model labels (CATALOGUE), so an unknown search shows what
# production shows: "Nisam prepoznao „X“, pa tražim „Y“", "Jesi li mislio na ...?" or no match.

cases:

# ═════════════════════════ long conversations (5–8 turns) ═════════════════════════
- id: v2-conv-golf-narrowing
  category: long_conversations
  impact: silent
  title: "golf → dizel → od 2015 → a jeftinije? → a novije? → pokaži još: every step keeps the model"
  turns:
    - say: "golf do 15000 KM"
      expect: {intent: find, filters: {search: golf, budget: 15000}}
    - say: "a dizel?"
      expect: {intent: find, filters: {search: golf, budget: 15000, fuel: diesel}}
    - say: "a od 2015?"
      expect: {intent: find, filters: {search: golf, budget: 15000, fuel: diesel, year_min: 2015}}
    - say: "a jeftinije?"
      expect:
        any_of:
          - {intent: find, filters: {search: golf, fuel: diesel}, lt: {budget: 15000}}
          - {intent: clarify}
    - say: "a novije?"
      expect:
        any_of:
          - {intent: find, filters: {search: golf}, gt: {year_min: 2015}}
          - {intent: clarify}
    - say: "pokaži još"
      expect: {intent: [find, no_more], search_has: [golf]}

- id: v2-conv-budget-change-midway
  category: long_conversations
  impact: silent
  title: "budget raised then lowered across turns; model and fuel survive each change"
  turns:
    - say: "treba mi passat dizel"
      expect: {intent: find, filters: {search: passat, fuel: diesel}}
    - say: "do 12000"
      expect: {intent: find, filters: {search: passat, fuel: diesel, budget: 12000}}
    - say: "ipak može do 16000"
      expect: {intent: find, filters: {search: passat, fuel: diesel, budget: 16000}}
    - say: "ne, ne, ipak max 14 hiljada"
      expect: {intent: find, filters: {search: passat, fuel: diesel, budget: 14000}}
    - say: "a automatik?"
      expect: {intent: find, filters: {search: passat, budget: 14000, transmission: automatic}}

- id: v2-conv-model-switch-keeps-budget
  category: long_conversations
  impact: silent
  title: "'a passat?' / 'a octavia?' after a budget search keep the budget, swap only the model"
  turns:
    - say: "golf dizel do 15000 KM"
      expect: {intent: find, filters: {search: golf, budget: 15000, fuel: diesel}}
    - say: "a passat?"
      expect: {intent: find, filters: {search: passat, budget: 15000}}
    - say: "a octavia?"
      expect: {intent: find, filters: {search: octavia, budget: 15000}}
    - say: "uporedi ih"
      expect: {intent: [compare, clarify]}
    - say: "ok hvala"
      expect: {handled: false}

- id: v2-conv-city-mid-conversation
  category: long_conversations
  impact: silent
  title: "'a u Sarajevu?' after a search must not replace the model with the city"
  turns:
    - say: "octavia do 20000 KM"
      expect: {intent: find, filters: {search: octavia, budget: 20000}}
    - say: "ne, mislio sam do 18000"
      expect: {intent: find, note: correction, filters: {search: octavia, budget: 18000}}
    - say: "a karavan?"
      expect: {intent: find, filters: {search: octavia, budget: 18000, family: true}}
    - say: "a u Sarajevu?"
      expect:
        any_of:
          - {intent: find, filters: {search: octavia, budget: 18000}}
          - {intent: [clarify, unsupported, chitchat]}
        search_lacks: [sarajevu, sarajevo]
    - say: "a automatik?"
      expect: {intent: find, filters: {search: octavia, transmission: automatic}}
    - say: "hvala"
      expect: {handled: false}

- id: v2-conv-advice-flow
  category: long_conversations
  impact: silent
  title: "imam 20k → šta da kupim → a šta se brzo prodaje → a trendovi → ok a dizel: the budget carries"
  turns:
    - say: "imam 20k"
      expect: {intent: find, filters: {budget: 20000}}
    - say: "šta da kupim"
      expect: {intent: suggest, filters: {budget: 20000}}
    - say: "a šta se brzo prodaje"
      expect: {intent: liquidity, filters: {budget: 20000}}
    - say: "a trendovi?"
      expect: {intent: trends}
    - say: "ok a dizel"
      expect: {intent: [find, suggest, liquidity], filters: {budget: 20000, fuel: diesel}}
    - say: "koji model je najbolji"
      expect: {intent: [suggest, clarify], filters: {budget: 20000}}

- id: v2-conv-price-then-followups
  category: long_conversations
  impact: visible
  title: "passat 2012 → koliko košta → a 2015? → uporedi sa octaviom"
  turns:
    - say: "passat 2012"
      expect: {intent: find, filters: {search: passat, year_min: 2012}}
    - say: "koliko košta"
      expect: {intent: [price_check, model_stats], search_has: [passat]}
    - say: "a 2015?"
      expect: {intent: [find, price_check, model_stats], search_has: [passat]}
    - say: "uporedi sa octaviom"
      expect: {intent: compare}

- id: v2-conv-km-unit-then-answer
  category: long_conversations
  impact: silent
  title: "the bot asks km or KM, the user answers in words, then narrows"
  turns:
    - say: "auto do 20000 km"
      expect: {intent: clarify, note: km_unit}
    - say: "mislio sam na cijenu, 20 hiljada maraka"
      expect: {intent: [find, suggest], filters: {budget: 20000, mileage_max: null}}
    - say: "a dizel"
      expect: {intent: [find, suggest], filters: {budget: 20000, fuel: diesel}}
    - say: "i da nije starije od 2014"
      expect: {intent: [find, suggest], filters: {budget: 20000, year_min: 2014}}
    - say: "pokaži još"
      expect: {intent: [find, no_more, clarify]}

- id: v2-conv-rambling-family
  category: long_conversations
  impact: silent
  title: "family buyer: vague start, budget, use, fuel, then a model question"
  turns:
    - say: "pozdrav, trebam auto za porodicu"
      expect: {intent: [clarify, find], filters: {family: true}, search_lacks: [pozdrav]}
    - say: "budžet je oko 25 hiljada"
      expect: {intent: [find, suggest], filters: {budget: 25000}}
    - say: "dvoje djece, puno putujemo, dizel bi bio najbolji"
      expect: {intent: [find, suggest], filters: {fuel: diesel, family: true}, search_lacks: [dvoje, putujemo]}
    - say: "šta misliš o touranu?"
      expect: {intent: [find, model_stats], search_has: [touran]}
    - say: "a sharan ili touran"
      expect: {intent: compare}
    - say: "super hvala ti"
      expect: {handled: false}

- id: v2-conv-correction-chain
  category: long_conversations
  impact: silent
  title: "three corrections in a row, each on the last reading"
  turns:
    - say: "golf 7 do 150000 km"
      expect: {intent: find, filters: {search: golf, mileage_max: 150000}}
    - say: "ne nego do 15000 KM"
      expect: {intent: find, filters: {search: golf, budget: 15000}}
    - say: "pogrešno, golf 6 ne 7"
      expect: {intent: find, filters: {search: golf, year_min: 2008, year_max: 2013}}
    - say: "rekao sam dizel"
      expect: {intent: find, filters: {search: golf, fuel: diesel}}
    - say: "ok"
      expect: {handled: false}

- id: v2-conv-trends-then-search
  category: long_conversations
  impact: visible
  title: "trends → 30 dana → golf do 15k → a pojeftinio li je golf?"
  turns:
    - say: "kakvi su trendovi"
      expect: {intent: trends}
    - say: "a za 30 dana"
      expect: {intent: trends, days: 30}
    - say: "golf do 15k"
      expect: {intent: find, filters: {search: golf, budget: 15000}}
    - say: "je li golf pojeftinio zadnjih mjesec dana"
      expect: {intent: trends, days: 30}

- id: v2-conv-new-then-used
  category: long_conversations
  impact: silent
  title: "new car first, then 'a polovni?' switches to used with the same budget"
  turns:
    - say: "novi auto do 40000 KM"
      expect: {intent: find, filters: {budget: 40000, new_ok: true}}
    - say: "a polovni?"
      expect: {intent: find, filters: {budget: 40000, new_ok: false}, search_lacks: [polovni]}
    - say: "dizel"
      expect: {intent: find, filters: {budget: 40000, fuel: diesel}}
    - say: "od 2019"
      expect: {intent: find, filters: {budget: 40000, year_min: 2019}}
    - say: "pokaži još"
      expect: {intent: [find, no_more]}

- id: v2-conv-mixed-language
  category: long_conversations
  impact: silent
  title: "a diaspora user switching between Bosnian and English"
  turns:
    - say: "Hi, looking for a golf under 15000 KM"
      expect: {intent: find, filters: {search: golf, budget: 15000}}
    - say: "a ima li dizel"
      expect: {intent: find, filters: {search: golf, fuel: diesel}}
    - say: "what about from 2016?"
      expect: {intent: find, filters: {search: golf, year_min: 2016}}
    - say: "ok thanks"
      expect: {handled: false}

- id: v2-conv-eight-turns
  category: long_conversations
  impact: silent
  title: "8 turns: search, filters, a correction, a model swap, show more, thanks"
  turns:
    - say: "Zdravo"
      expect: {intent: chitchat}
    - say: "tražim octaviju"
      expect: {intent: find, search_has: [octavia]}
    - say: "do 18 hiljada"
      expect: {intent: find, filters: {search: octavia, budget: 18000}}
    - say: "od 2016"
      expect: {intent: find, filters: {search: octavia, budget: 18000, year_min: 2016}}
    - say: "ispod 180 hiljada km"
      expect: {intent: find, filters: {search: octavia, mileage_max: 180000, budget: 18000}}
    - say: "ne, mislio sam do 20000 KM"
      expect: {intent: find, filters: {search: octavia, budget: 20000, mileage_max: 180000}}
    - say: "a superb?"
      expect: {intent: find, filters: {search: superb, budget: 20000}}
    - say: "hvala puno"
      expect:
        any_of:
          - {handled: false}
          - {intent: chitchat}


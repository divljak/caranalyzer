      expect: {intent: [find, clarify], search_lacks: ["999999999"]}

- id: v2-cur-zero
  category: currency_formats
  impact: cosmetic
  title: "'do 0 KM' asks for a real budget (the 'cannot connect that' help with examples is acceptable)"
  turns:

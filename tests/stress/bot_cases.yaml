# Garaža bot stress cases: realistic Bosnian / Serbian / Croatian questions and conversations.
#
# The EXPECTATIONS are product intent, written from what a sensible user wants, not from what the parser
# does today. A failing case is a finding. See tests/stress/README.md for the schema.
#
# Turn keys:   say, reply (true = Telegram reply to the bot's previous message), covers [1-8], expect
# covers:      which of the 8 answer-quality fixes (see README) should make this turn pass; omit = a new issue
# expect keys: intent (str|list), note, filters{search,budget,price_min,mileage_max,mileage_min,year_min,
#              year_max,fuel,transmission,new_ok,family,low_km}, search_has[], search_lacks[], sort
#              (price|recency), reply_has[], reply_has_any[], reply_lacks[], buttons_min, buttons_have[],
#              buttons_have_any[], handled, any_of[] (alternative acceptable readings)
#              footer_chars_max (characters of notes + disclaimer under the listing rows), handled
# Year values: "Y-10" = this year minus 10.   Case keys: id, category, title, chat (private|group), dataset (rows|empty)

cases:

# ───────────────────────── the real failing chat (Bosnian) ─────────────────────────
- id: orig-1-km-is-price
  category: original_chat
  title: "'do 30 000km' without a model, meant 30k KM (real chat, message 1)"
  turns:
    - say: "Auto do 30 000km da nije starije od 10 godina"
      covers: [1]
      expect: {intent: clarify, note: km_unit}

- id: orig-2-budget-correction-standalone
  category: original_chat
  title: "'Budžet je 30k a prva dva su izvan budžeta' alone (real chat, message 2)"
  turns:
    - say: "Budžet je 30k a prva dva su izvan budžeta"
      covers: [2]
      expect: {intent: [find, suggest, liquidity], filters: {budget: 30000}}

- id: orig-3-mixed-budget-sell-trends
  category: original_chat
  title: "budget + what sells fast + trends in one message (real chat, message 3)"
  turns:
    - say: "Ok imam 30k budžet. Koje auto da kupim koje mogu brzo prodati. Koji su trendovi"
      covers: [4]
      expect:
        intent: [liquidity, suggest]
        filters: {budget: 30000}
        reply_has_any: [trend, preskoč, preskoc, nisam odgovor, posebno, odvojeno, zasebno]

- id: orig-4-which-models
  category: original_chat
  title: "'Da ali koji auto, koji modeli' alone: no budget known, so asking for one is right (sanity check)"
  turns:
    - say: "Da ali koji auto, koji modeli"
      expect: {intent: clarify, buttons_min: 2}

- id: orig-5-kn-resale
  category: original_chat
  title: "'Bilo koji model koji se brzo prodaje do 30000kn' (real chat, message 5)"
  dataset: empty
  turns:
    - say: "Bilo koji model koji se brzo prodaje do 30000kn"
      covers: [1, 6]
      expect:
        intent: [liquidity, suggest, clarify]
        search_lacks: [bilo, kn]
        buttons_min: 1

- id: orig-full-conversation
  category: original_chat
  title: "the whole failing conversation in order, one private chat"
  turns:
    - say: "Auto do 30 000km da nije starije od 10 godina"
      covers: [1]
      expect: {intent: clarify, note: km_unit}
    - say: "Budžet je 30k a prva dva su izvan budžeta"
      covers: [2]
      expect: {filters: {budget: 30000}}
    - say: "Ok imam 30k budžet. Koje auto da kupim koje mogu brzo prodati. Koji su trendovi"
      covers: [4]
      expect: {intent: [liquidity, suggest], filters: {budget: 30000}}
    - say: "Da ali koji auto, koji modeli"
      covers: [3]
      expect: {intent: [suggest, liquidity, find], filters: {budget: 30000}}
    - say: "Bilo koji model koji se brzo prodaje do 30000kn"
      covers: [1, 6]
      expect: {intent: [liquidity, suggest, clarify], search_lacks: [bilo, kn]}

# ───────────────────────── price vs mileage ambiguity ─────────────────────────
- id: unit-km-lower-no-model
  category: price_vs_mileage
  title: "'do 20000km' with no model is ambiguous: ask"
  turns:
    - say: "auto do 20000 km"
      covers: [1]
      expect: {intent: clarify, note: km_unit}

- id: unit-km-upper-no-model
  category: price_vs_mileage
  title: "'do 15000 KM' (capital) with no model is a price"
  turns:
    - say: "auto do 15000 KM"
      expect: {intent: find, filters: {budget: 15000, mileage_max: null}}

- id: unit-km-lower-with-model
  category: price_vs_mileage
  title: "'Golf do 150000 km' is clearly mileage (too big for a price)"
  turns:
    - say: "Golf do 150000 km"
      expect: {intent: find, filters: {search: golf, mileage_max: 150000, budget: null}}

- id: unit-km-capital-with-model
  category: price_vs_mileage
  title: "'Golf 7 do 15000 KM' is a price"
  turns:
    - say: "Golf 7 do 15000 KM"
      expect: {intent: find, filters: {search: golf, budget: 15000, mileage_max: null}}

- id: unit-k-suffix
  category: price_vs_mileage
  title: "'15k' is 15.000 KM"
  turns:
    - say: "passat do 15k"
      expect: {intent: find, filters: {search: passat, budget: 15000, mileage_max: null}}

- id: unit-hiljada
  category: price_vs_mileage
  title: "'20 hiljada' is a price"
  turns:
    - say: "Octavia do 20 hiljada"
      expect: {intent: find, filters: {search: octavia, budget: 20000, mileage_max: null}}

- id: unit-soma
  category: price_vs_mileage
  title: "slang 'do 15 soma' (soma = 1000 KM)"
  turns:
    - say: "Golf do 15 soma"
      expect: {intent: find, filters: {search: golf, budget: 15000, mileage_max: null}}

- id: unit-kn
  category: price_vs_mileage
  title: "'kn' (kuna) is a price, never mileage or a model word"
  turns:
    - say: "Golf 6 do 30000kn"
      covers: [1]
      expect:
        any_of:
          - {intent: find, filters: {search: golf, budget: 30000, mileage_max: null}}
          - {intent: clarify, note: currency}

- id: unit-kn-no-model
  category: price_vs_mileage
  title: "'auto do 30000 kn' must not become a search for the word 'kn'"
  turns:
    - say: "auto do 30000 kn"
      covers: [1]
      expect:
        search_lacks: [kn]
        filters: {mileage_max: null}

- id: unit-eur
  category: price_vs_mileage
  title: "price in EUR: ask about the currency, never read it as KM"
  turns:
    - say: "Golf 7 do 10000 EUR"
      expect: {intent: clarify, note: currency}

- id: unit-evra
  category: price_vs_mileage
  title: "price in 'evra'"
  turns:
    - say: "passat do 8000 evra"
      expect: {intent: clarify, note: currency}

- id: unit-eura-symbol
  category: price_vs_mileage
  title: "price with the euro sign"
  turns:
    - say: "audi a4 do 12000€"
      expect: {intent: clarify, note: currency}

- id: unit-bare-number-after-model
  category: price_vs_mileage
  title: "'golf 15' is ambiguous (2015? 15k?): ask, do not guess"
  turns:
    - say: "golf 15"
      expect: {intent: clarify}

- id: unit-km-plus-year-no-model
  category: price_vs_mileage
  title: "'do 30000km novije od 2018' without a model"
  turns:
    - say: "do 30000km novije od 2018"
      covers: [1]
      expect: {intent: clarify, note: km_unit}

# ───────────────────────── budgets and corrections ─────────────────────────
- id: budget-correction-budzet-je
  category: budget_corrections
  title: "'budžet je 25k' after a search replaces the price bound"
  turns:
    - say: "golf do 15000 KM"
      expect: {intent: find, filters: {search: golf, budget: 15000}}
    - say: "budžet je 25k"
      covers: [2]
      expect: {intent: find, filters: {search: golf, budget: 25000}}

- id: budget-correction-imam
  category: budget_corrections
  title: "'imam 20k' after a search"
  turns:
    - say: "passat do 10000 KM"
      expect: {intent: find, filters: {search: passat, budget: 10000}}
    - say: "imam 20k"
      covers: [2]
      expect: {intent: find, filters: {search: passat, budget: 20000}}

- id: budget-correction-izvan
  category: budget_corrections
  title: "'ovo je izvan budžeta, imam 12k'"
  turns:
    - say: "octavia do 25000 KM"
      expect: {intent: find, filters: {budget: 25000}}
    - say: "ovo je izvan budžeta, imam 12k"
      covers: [2]
      expect: {intent: find, filters: {search: octavia, budget: 12000}}

- id: budget-correction-preko
  category: budget_corrections
  title: "'preko budžeta' with a new limit"
  turns:
    - say: "golf 6 do 9000 KM"
      expect: {intent: find, filters: {budget: 9000}}
    - say: "sve preko budžeta, do 7000"
      covers: [2]
      expect: {intent: find, filters: {search: golf, budget: 7000}}

- id: budget-correction-no-number
  category: budget_corrections
  title: "'izvan budžeta' with no new number: say what is needed, no crash"
  turns:
    - say: "golf do 12000 KM"
      expect: {intent: find}
    - say: "ovo je izvan budžeta"
      covers: [2]
      expect: {intent: [clarify, find], reply_has_any: [budžet, budzet, koliko, limit]}

- id: budget-correction-mislim
  category: budget_corrections
  title: "existing: 'mislim da sam stavio 50-60k' corrects the previous range"
  turns:
    - say: "golf 7 do 30000 KM"
      expect: {filters: {budget: 30000}}
    - say: "mislim da sam stavio 15-20k"
      expect: {intent: find, filters: {search: golf, price_min: 15000, budget: 20000}}

- id: budget-remembered-across-messages
  category: budget_corrections
  title: "a stated budget carries to the next vague question"
  turns:
    - say: "imam 20k budžet"
      expect: {intent: [suggest, find, clarify]}
    - say: "koji su modeli?"
      covers: [3]
      expect: {intent: [suggest, find, liquidity], filters: {budget: 20000}}

- id: budget-remembered-then-fuel
  category: budget_corrections
  title: "budget set once, then only 'dizel?'"
  turns:
    - say: "šta mogu kupiti do 18000 KM"
      expect: {intent: [suggest, find], filters: {budget: 18000}}
    - say: "a dizel?"
      covers: [3]
      expect: {filters: {budget: 18000, fuel: diesel}}

- id: budget-max
  category: budget_corrections
  title: "'maksimalno 9000' reads as a price"
  turns:
    - say: "polo maksimalno 9000 KM"
      expect: {intent: find, filters: {search: polo, budget: 9000}}

# ───────────────────────── follow-ups that rely on context ─────────────────────────
- id: follow-year
  category: followups
  title: "'a od 2018?' narrows the previous search"
  turns:
    - say: "golf do 15000 KM"
      expect: {filters: {search: golf, budget: 15000}}
    - say: "a od 2018?"
      expect: {intent: find, filters: {search: golf, budget: 15000, year_min: 2018}}

- id: follow-fuel
  category: followups
  title: "'a dizel?' after a model search"
  turns:
    - say: "octavia do 20000 KM"
      expect: {filters: {search: octavia}}
    - say: "a dizel?"
      expect: {intent: find, filters: {search: octavia, budget: 20000, fuel: diesel}}

- id: follow-gearbox
  category: followups
  title: "'a automatik?'"
  turns:
    - say: "passat dizel do 18000 KM"
      expect: {filters: {search: passat, fuel: diesel}}
    - say: "a automatik?"
      expect: {intent: find, filters: {search: passat, fuel: diesel, transmission: automatic}}

- id: follow-more
  category: followups
  title: "'pokaži još' pages on"
  turns:
    - say: "golf do 15000 KM"
      expect: {intent: find}
    - say: "pokaži još"
      expect: {intent: [find, no_more], filters: {search: golf}}

- id: follow-cheaper
  category: followups
  title: "'nešto jeftinije' lowers the bound or asks how much"
  turns:
    - say: "golf do 15000 KM"
      expect: {intent: find}
    - say: "nešto jeftinije"
      expect:
        any_of:
          - {intent: find, filters: {search: golf}}
          - {intent: clarify, reply_has_any: [koliko, budžet, budzet, do]}

- id: follow-newer
  category: followups
  title: "'a novije?' narrows by year or asks which year"
  turns:
    - say: "passat do 12000 KM"
      expect: {intent: find}
    - say: "a novije?"
      expect:
        any_of:
          - {intent: find, filters: {search: passat}}
          - {intent: clarify}

- id: follow-reply-to-bot
  category: followups
  title: "a Telegram reply to the bot's answer carries the scope"
  turns:
    - say: "octavia do 20000 KM"
      expect: {intent: find}
    - say: "od 2017"
      reply: true
      expect: {intent: find, filters: {search: octavia, budget: 20000, year_min: 2017}}



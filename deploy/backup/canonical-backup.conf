[Service]
# The existing daily schedule already supplies canonical data snapshots.
# Extend it with complete application archives; no second timer or source visit.
ExecStartPre=/opt/car-analyzer/.daily-delivery/backup-tools/run-canonical-backup.sh before
ExecStopPost=/opt/car-analyzer/.daily-delivery/backup-tools/run-canonical-backup.sh after
# Preserve the collector's stop bound and allow the post-failure archive to finish.
TimeoutStopSec=5min

name: Verify collector migration

on:
  pull_request:
    paths:
      - .github/workflows/collector-verify.yml
      - Dockerfile.collector
      - requirements-collector.lock
      - database/**
      - scripts/**
      - scrapers/**
      - tests/**
      - run_website_sync.py
      - market_labels.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car-analyzer-collector
  cancel-in-progress: false

jobs:
  verify:
    name: Verify without collecting
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the live collector baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run focused unit tests
        run: python3 -m unittest tests.test_github_collector_verification

      - name: Build the pinned collector image
        run: >-
          docker build --platform linux/amd64
          --file Dockerfile.collector
          --tag "car-analyzer-collector:${GITHUB_SHA}" .

      - name: Test the collector inside its pinned image
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --entrypoint python
          --mount type=bind,src="${PWD}/tests",dst=/app/tests,readonly
          "car-analyzer-collector:${GITHUB_SHA}"
          -m unittest tests.test_direct_collector

      - name: Verify Supabase roles and rolled-back writes
        if: github.event_name == 'workflow_dispatch'
        env:
          COLLECTOR_DB_PASSWORD: ${{ secrets.COLLECTOR_DB_PASSWORD }}
          BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age=1.1.1-1ubuntu0.24.04.3
          python3 scripts/github_collector_verification.py \
            --image "car-analyzer-collector:${GITHUB_SHA}" \
            --recipient-file deploy/recovery/car-analyzer-backup-recipient.pub \
            --encrypted-backup "${RUNNER_TEMP}/car-analyzer-recovery-${GITHUB_RUN_ID}.json.gz.age"

      - name: Retain encrypted recovery snapshot
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: car-analyzer-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/car-analyzer-recovery-${{ github.run_id }}.json.gz.age
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

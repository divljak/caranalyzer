name: Verify or shadow-run collector migration

on:
  pull_request:
    paths:
      - .github/workflows/collector-verify.yml
      - Dockerfile.collector
      - requirements-collector.lock
      - database/**
      - scripts/**
      - scrapers/**
      - tests/**
      - run_website_sync.py
      - market_labels.py
  workflow_dispatch:
    inputs:
      mode:
        description: Safe verification or one real shadow collection
        required: true
        default: verify
        type: choice
        options:
          - verify
          - shadow_collect
      confirm_shadow_collection:
        description: Type COLLECT_ONCE only for a real shadow collection
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: car-analyzer-collector
  cancel-in-progress: false

jobs:
  verify:
    name: Verify without collecting
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the live collector baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run focused unit tests
        run: python3 -m unittest tests.test_github_collector_verification

      - name: Build the pinned collector image
        run: >-
          docker build --platform linux/amd64
          --file Dockerfile.collector
          --tag "car-analyzer-collector:${GITHUB_SHA}" .

      - name: Test the collector inside its pinned image
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --entrypoint python
          --mount type=bind,src="${PWD}/tests",dst=/app/tests,readonly
          "car-analyzer-collector:${GITHUB_SHA}"
          -m unittest tests.test_direct_collector

      - name: Verify Supabase or run one confirmed shadow collection
        if: github.event_name == 'workflow_dispatch'
        env:
          COLLECTOR_DB_PASSWORD: ${{ secrets.COLLECTOR_DB_PASSWORD }}
          BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
          COLLECTOR_SHADOW_CONFIRMATION: ${{ inputs.confirm_shadow_collection }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age=1.1.1-1ubuntu0.24.04.3
          collector_args=()
          if [[ "${{ inputs.mode }}" == "shadow_collect" ]]; then
            if [[ "${COLLECTOR_SHADOW_CONFIRMATION}" != "COLLECT_ONCE" ]]; then
              echo "Shadow collection requires the exact COLLECT_ONCE confirmation." >&2
              exit 2
            fi
            collector_args+=(--collect)
          fi
          python3 scripts/github_collector_verification.py \
            --image "car-analyzer-collector:${GITHUB_SHA}" \
            --recipient-file deploy/recovery/car-analyzer-backup-recipient.pub \
            --encrypted-backup "${RUNNER_TEMP}/car-analyzer-recovery-${GITHUB_RUN_ID}.json.gz.age" \
            "${collector_args[@]}"

      - name: Retain encrypted recovery snapshot
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (success() || inputs.mode == 'shadow_collect')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: car-analyzer-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/car-analyzer-recovery-${{ github.run_id }}.json.gz.age
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

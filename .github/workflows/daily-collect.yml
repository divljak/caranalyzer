name: Daily collection

# Two runs a day, ~12 h apart (approved 18 Nov 2026). Primary trigger: the VPS calls workflow_dispatch
# at ~08:15 (morning slot) and ~20:15 Europe/Sarajevo (evening slot, reason vps-timer-evening), see
# deploy/trigger/. The schedules are only fallbacks: each exits without visiting OLX when a real run
# already succeeded in ITS slot today (UTC day split at 12:00, see scripts/collection_slot.py), so a
# good morning run never makes the evening fallback skip.
# Budget per day: 6 search pages (3 per run), 20 detail checks (10 morning, evening gets the rest).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was started (shown in the run name)
        required: false
        default: manual
        type: string
      mode:
        description: collect = real OLX collection; verify = no OLX visits, rolled-back Supabase writes
        required: false
        default: collect
        type: choice
        options:
          - collect
          - verify
      slot:
        description: Run slot (auto = evening when the reason contains "evening", else morning)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning
          - evening
  schedule:
    # 09:40 UTC = 10:40 CET / 11:40 CEST, after the morning VPS trigger should have run.
    - cron: "40 9 * * *"
    # 21:40 UTC = 22:40 CET / 23:40 CEST, after the evening VPS trigger should have run.
    - cron: "40 21 * * *"

run-name: >-
  Daily collection (${{ github.event_name == 'schedule' && (github.event.schedule == '40 21 * * *' && 'schedule fallback, evening' || 'schedule fallback') || inputs.reason || 'manual' }}${{ inputs.mode == 'verify' && ', verify only' || '' }})

permissions:
  contents: read
  actions: read  # only to check whether today's run already succeeded

# Same group as collector-verify.yml: never two collectors at once, never cancel one mid-run.
concurrency:
  group: car-analyzer-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Collect from OLX into Supabase
    runs-on: ubuntu-24.04
    # Build ~3 min + collection ~8 min (3 search pages, up to ~10-20 details, 15 s spacing) + backups.
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Work out the run slot
        id: slot
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ inputs.reason }}
          INPUT_SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          slot="$(python3 scripts/collection_slot.py slot --event "$EVENT" --reason "$REASON" \
            --input-slot "$INPUT_SLOT" --schedule "$SCHEDULE")"
          echo "slot=${slot}" >> "$GITHUB_OUTPUT"
          echo "Run slot: ${slot}"

      - name: Skip if this slot's collection already succeeded today
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the schedule fallback can skip; a dispatch (VPS timer or manual) always runs.
          run="$(python3 scripts/collection_slot.py gate --event "$GITHUB_EVENT_NAME" --slot "${{ steps.slot.outputs.slot }}")"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Run wrapper unit tests
        if: steps.gate.outputs.run == 'true'
        run: python3 -m unittest tests.test_github_collector_verification tests.test_collection_budget tests.test_collection_slot

      - name: Build the pinned collector image
        if: steps.gate.outputs.run == 'true'
        run: >-
          docker build --platform linux/amd64
          --file Dockerfile.collector
          --tag "car-analyzer-collector:${GITHUB_SHA}" .

      - name: Check the parser against PIK markup in the image's Chromium (loopback only)
        if: steps.gate.outputs.run == 'true'
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges
          --user "$(id -u):$(id -g)"
          --tmpfs /tmp:rw,noexec,nosuid,size=512m --env HOME=/tmp
          --env DETAIL_BROWSER_LOOPBACK=1
          --entrypoint python
          --mount type=bind,src="${PWD}/tests",dst=/app/tests,readonly
          "car-analyzer-collector:${GITHUB_SHA}"
          -m unittest tests.test_browser_loopback tests.test_pik_layout

      - name: Collect into Supabase
        if: steps.gate.outputs.run == 'true'
        env:
          COLLECTOR_DB_PASSWORD: ${{ secrets.COLLECTOR_DB_PASSWORD }}
          BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
          COLLECTOR_RUN_MODE: daily
          COLLECTOR_SLOT: ${{ steps.slot.outputs.slot }}
          MODE: ${{ inputs.mode || 'collect' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age=1.1.1-1ubuntu0.24.04.3
          collect_flag=()
          [[ "${MODE}" == "verify" ]] || collect_flag=(--collect)
          python3 scripts/github_collector_verification.py \
            "${collect_flag[@]}" \
            --image "car-analyzer-collector:${GITHUB_SHA}" \
            --recipient-file deploy/recovery/car-analyzer-backup-recipient.pub \
            --encrypted-backup "${RUNNER_TEMP}/car-analyzer-recovery-${GITHUB_RUN_ID}.json.gz.age" \
            --diagnostics "${RUNNER_TEMP}/diagnostics/collection.json"

      - name: Summarize
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/diagnostics"
          {
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            docker run --rm --entrypoint chromium "car-analyzer-collector:${GITHUB_SHA}" --version 2>/dev/null || true
            df -h / | tail -1
            free -m | sed -n 2p
          } > "${RUNNER_TEMP}/diagnostics/runtime.txt" || true
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY" || true
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "diagnostics", "collection.json")
          try:
              d = json.load(open(path))
          except Exception as exc:
              print(f"No collection summary ({type(exc).__name__})"); raise SystemExit
          c = d.get("collection") or {}
          print("| field | value |\n|---|---|")
          for k in ("status", "search_attempted", "search_retries", "detail_attempted", "details_completed",
                    "observations", "new_listings", "errors", "stopped_reason"):
              print(f"| {k} | {c.get(k)} |")
          budget_limited = (c.get("status") == "partial" and not c.get("errors") and not c.get("rejected")
                            and c.get("stopped_reason") == "discovery_budget_incomplete")
          print(f"| outcome | {'budget_limited (healthy: daily page budget used, no errors)' if budget_limited else c.get('status')} |")
          print(f"| exit_code | {d.get('exit_code')} |\n| failure_class | {d.get('failure_class')} |")
          for f in c.get("failures") or []:
              keep = {k: f.get(k) for k in ("phase", "page", "attempt", "exception", "navigation_ms", "dom_ms",
                                            "document_status", "ready_state", "title", "final_url", "parser_reason",
                                            "dom_fingerprint")}
              print(f"\nFailure: `{json.dumps(keep, ensure_ascii=False)}`")
          EOF

      - name: Upload diagnostics
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-collection-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Retain encrypted recovery snapshot
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: car-analyzer-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/car-analyzer-recovery-${{ github.run_id }}.json.gz.age
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  alert-on-failure:
    name: Alert Telegram on failure
    needs: collect
    # Real runs only: a failed verify run is a test, not an outage.
    if: failure() && inputs.mode != 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Send the alert (secrets TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/collection_alert.py failure --run-url "$RUN_URL" --reason "The collect job failed (see the run log and diagnostics artifact)."

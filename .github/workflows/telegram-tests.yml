name: Telegram bot tests

# Runs the Telegram bot and Gemini-layer tests on pull requests, including the SQL-backed
# ones against a throwaway PostgreSQL built from supabase/migrations. Nothing here talks to
# Telegram, Gemini, Supabase or Vercel: every network call in these tests is mocked.

on:
  pull_request:
    paths:
      - .github/workflows/telegram-tests.yml
      - telegram_*.py
      - database/run_outcome.py
      - scripts/collector_health.py
      - scripts/bot_interactions_weekly.sql
      - docs/proposed-migrations/**
      - dealer_api.py
      - market_labels.py
      - database/**
      - supabase/migrations/**
      - tests/test_telegram_*.py
      - tests/test_run_outcome.py
      - tests/test_collector_health.py
      - requirements*.txt

permissions:
  contents: read

concurrency:
  group: telegram-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telegram:
    name: Telegram and Gemini layer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cartest
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: cartest
      PGOPTIONS: -c client_min_messages=warning
      DEALER_TEST_DATABASE_URL: postgresql+psycopg2://postgres:test-only@127.0.0.1:5432/cartest
    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check -r requirements-dealer.txt

      - name: Build the schema from the Supabase migrations
        run: |
          for role in anon authenticated service_role car_analyzer_sync car_analyzer_collector car_analyzer_backup car_analyzer_app; do
            psql -q -v ON_ERROR_STOP=1 -c "CREATE ROLE $role"
          done
          for file in supabase/migrations/*.sql; do
            psql -q -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run the Telegram tests
        run: >-
          PYTHONPATH=tests .venv/bin/python -m unittest -v
          tests.test_telegram_bot tests.test_telegram_llm tests.test_telegram_digest
          tests.test_telegram_experience tests.test_telegram_questions tests.test_telegram_companion
          tests.test_telegram_junk_search tests.test_telegram_shortlist tests.test_telegram_follow
          tests.test_telegram_group_window tests.test_telegram_chat_setup tests.test_telegram_log
          tests.test_telegram_ranges tests.test_telegram_sweep_fixes tests.test_telegram_sweep_weak
          tests.test_telegram_sweep_16nov tests.test_telegram_answer_quality

      - name: Run the run-outcome and health-check tests
        run: PYTHONPATH=tests .venv/bin/python -m unittest -v tests.test_run_outcome tests.test_collector_health
